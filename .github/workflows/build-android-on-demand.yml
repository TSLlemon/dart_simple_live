name: Build Android APK (on-demand)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Pub get
        run: |
          cd simple_live_app
          flutter pub get

      # 无签名 secrets 时使用 debug 签名，本地安装可直接用
      - name: Build APK (arm64, debug-signed release)
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi
        env:
          ORG_GRADLE_PROJECT_DEBUG_KEYSTORE_PWD: debug
          ORG_GRADLE_PROJECT_DEBUG_KEY_PWD: debug

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-android
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
