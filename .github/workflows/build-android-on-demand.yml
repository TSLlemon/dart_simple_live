name: Build Android APK (on-demand)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          cache: true

      - name: Pub get
        run: |
          cd simple_live_app
          # 上游未提交 pubspec.lock；auto_orientation_v2 2.4.7 (2026-10-08) 的
          # android/build.gradle 使用旧式 kotlin() DSL，与 AGP 8.9.1 / KGP 2.1.0
          # 不兼容导致 Gradle 评估失败。钉到已验证无该问题的 2.4.6。
          # （其他依赖仍按 pubspec.yaml 的 caret 约束解析最新版）
          flutter pub add auto_orientation_v2:2.4.6 --dry-run >/dev/null 2>&1 || true
          sed -i.bak 's/auto_orientation_v2: \^2\.3\.6/auto_orientation_v2: 2.4.6/' pubspec.yaml
          rm -f pubspec.yaml.bak
          grep auto_orientation pubspec.yaml
          flutter pub get

      # fork 无原仓库签名 secrets：生成自签 keystore 并写入 key.properties，
      # 满足 build.gradle.kts 的 release signingConfig 读取。
      - name: Generate debug keystore and key.properties
        run: |
          cd simple_live_app/android
          keytool -genkey -v \
            -keystore debug-self.keystore \
            -storetype PKCS12 \
            -alias simplelive \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass simplelive-debug \
            -keypass simplelive-debug \
            -dname "CN=SimpleLive Debug, OU=Dev, O=Fork, L=Local, ST=Local, C=CN"
          cat > key.properties <<EOF
          storeFile=debug-self.keystore
          storePassword=simplelive-debug
          keyPassword=simplelive-debug
          keyAlias=simplelive
          EOF
          echo "key.properties:"; cat key.properties

      # auto_orientation_v2 的 build.gradle 没设 compileOptions（Java 默认 1.8），
      # 与 KGP 2.2.20 的 Kotlin 17 冲突。直接给插件源码打补丁插入 compileOptions。
      - name: Patch auto_orientation_v2 compileOptions (Java 17)
        run: |
          AO_GRADLE="$HOME/.pub-cache/hosted/pub.dev/auto_orientation_v2-2.4.6/android/build.gradle"
          if [ -f "$AO_GRADLE" ]; then
            if ! grep -q "compileOptions" "$AO_GRADLE"; then
              sed -i 's|    lintOptions {|    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n\n    lintOptions {|' "$AO_GRADLE"
              echo "Patched $AO_GRADLE:"
              grep -A 3 "compileOptions" "$AO_GRADLE"
            else
              echo "compileOptions already present, skip"
            fi
          else
            echo "WARN: $AO_GRADLE not found"
          fi

      - name: Build APK (release, self-signed)
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-android
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
